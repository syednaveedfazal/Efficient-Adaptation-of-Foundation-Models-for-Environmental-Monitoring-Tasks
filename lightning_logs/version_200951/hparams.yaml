seed: 42
use_wandb: false
wandb_project: burn-scar
data:
  raw_dir: data/raw/hls_burn_scars
  stats_path: data/processed/stats.json
  val_json: data/splits/val_scenes.json
  batch_size: 4
  num_workers: 4
model:
  name: prithvi_lora_r8
  params:
    weights_path: models/pretrained/prithvi/Prithvi_EO_V2_300M.pt
    num_classes: 2
    lora_rank: 8
    lora_alpha: 8
loss:
  ce_weight: 0.5
  dice_weight: 0.5
  class_weights:
  - 1.0
  - 8.0
optimizer:
  lr: 0.0002
  weight_decay: 0.01
trainer:
  max_epochs: 100
  patience: 15
  checkpoint_dir: results/checkpoints/
  precision: 16-mixed
