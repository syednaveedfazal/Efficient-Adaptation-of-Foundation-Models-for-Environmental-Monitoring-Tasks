seed: 42
use_wandb: false
wandb_project: burn-scar
data:
  raw_dir: data/raw/hls_burn_scars
  stats_path: data/processed/stats.json
  val_json: data/splits/val_scenes.json
  batch_size: 8
  num_workers: 4
model:
  name: unet
  params:
    in_channels: 6
    num_classes: 2
    base_filters: 64
    bilinear: true
loss:
  ce_weight: 0.5
  dice_weight: 0.5
  class_weights:
  - 1.0
  - 8.0
optimizer:
  lr: 0.0001
  weight_decay: 0.0001
trainer:
  max_epochs: 2
  patience: 15
  checkpoint_dir: results/checkpoints/
  precision: 16-mixed
