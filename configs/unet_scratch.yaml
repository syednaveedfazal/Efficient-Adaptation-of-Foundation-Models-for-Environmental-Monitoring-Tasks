seed: 42
use_wandb: false
wandb_project: burn-scar

data:
  raw_dir:     data/raw/hls_burn_scars       # training/ and validation/ live here
  stats_path:  data/processed/stats.json     # generated by scripts/prepare_dataset.py
  val_json:    data/splits/val_scenes.json   # generated by scripts/prepare_dataset.py
  batch_size:  4                             # 512×512 UNet — safe for 16 GB VRAM
  num_workers: 4                             # match --cpus-per-task in SLURM

model:
  name: unet_scratch                 # key in src/models/registry.py
  params:                    # passed directly to UNet.__init__()
    in_channels:  6          # Blue, Green, Red, NIR, SW1, SW2
    num_classes:  2          # 0 = not burned, 1 = burn scar
    base_filters: 85         # encoder: 85 → 170 → 340 → 680 → 680
    bilinear:     true

loss:
  ce_weight:     0.5
  dice_weight:   0.5
  class_weights: [1.0, 8.0]  # burn scar ~8x rarer → upweight it

optimizer:
  lr:           1.0e-4
  weight_decay: 1.0e-4

trainer:
  max_epochs:      100
  patience:        15
  checkpoint_dir:  results/checkpoints/     # top-k checkpoints saved here
  precision:       16-mixed                 # change to "32" if you see NaN losses